[defaults]
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
roles_path = roles
forks = 4
timeout = 60

[ssh_connection]
pipelining = True
# Windows OpenSSH is used from WSL to reach Vagrant localhost forwards.
# It cannot use Ansible's Linux ControlPath, so multiplexing stays disabled.
ssh_args = -o ServerAliveInterval=15 -o ServerAliveCountMax=6

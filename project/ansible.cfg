[defaults]
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
roles_path = roles
forks = 4
timeout = 60

[ssh_connection]
pipelining = True
# One shared SSH connection per host: without this Ansible opens a new
# connection for every task and exhausts sshd MaxStartups on the small VMs,
# which shows up as "timed out during banner exchange".
# The same options are written into inventory/hosts.ini, because Ansible
# ignores an ansible.cfg that lives in a world-writable /mnt/c directory.
# ControlPath is left to Ansible, which points it at ~/.ansible/cp per host.
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=15 -o ServerAliveCountMax=6

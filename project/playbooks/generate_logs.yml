---
# Produces nginx/backend traffic with 200, 404 and 500 responses so the ELK
# scenario has something to show.
#   ANSIBLE_CONFIG=./ansible.cfg ansible-playbook -i inventory/hosts.ini playbooks/generate_logs.yml

- name: Generate demo traffic
  # Vagrant runs on Windows while Ansible runs in WSL. WSL cannot reliably
  # route to VirtualBox's host-only network, so originate traffic in the lab.
  hosts: frontend
  gather_facts: false
  vars_files: [../group_vars/all.yml]
  vars:
    ansible_become: false
    web: "https://{{ web_ip }}"
  tasks:
    - name: Browse the site (HTTP 200)
      ansible.builtin.uri:
        url: "{{ web }}{{ item }}"
        validate_certs: false
      loop: "{{ ['/', '/api/articles', '/api/whoami'] * 20 }}"
      loop_control:
        label: "{{ item }}"

    - name: Create articles (HTTP 201)
      ansible.builtin.uri:
        url: "{{ web }}/api/articles"
        validate_certs: false
        method: POST
        body_format: json
        body:
          title: "demo {{ item }}"
          body: "generated by generate_logs.yml"
        status_code: [201]
      loop: "{{ range(1, 6) | list }}"

    - name: Missing pages and demo errors (HTTP 404 and 500)
      ansible.builtin.uri:
        url: "{{ web }}{{ item }}"
        validate_certs: false
        status_code: [404, 500]
      loop: "{{ ['/nonexistent', '/api/demo-error'] * 5 }}"
      loop_control:
        label: "{{ item }}"

    - name: Summary
      ansible.builtin.debug:
        msg: "Generated GET / , GET/POST /api/articles, 404 /nonexistent and 500 /api/demo-error"

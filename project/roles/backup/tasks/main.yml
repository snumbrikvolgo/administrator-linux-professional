---
# Scheduled logical backup of the cms database on the PostgreSQL primary.
# pg_dump + gzip + retention, driven by a systemd timer. Restore: see docs.

- name: Create backup directory
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: Install backup script
  ansible.builtin.template:
    src: cms-backup.sh.j2
    dest: /usr/local/bin/cms-backup.sh
    owner: root
    group: root
    mode: "0755"

- name: Install backup service and timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    owner: root
    group: root
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - name: cms-backup.service
      content: |
        [Unit]
        Description=Dump the cms database
        [Service]
        Type=oneshot
        User=postgres
        ExecStart=/usr/local/bin/cms-backup.sh
    - name: cms-backup.timer
      content: |
        [Unit]
        Description=Daily cms database backup
        [Timer]
        OnCalendar=daily
        Persistent=true
        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"

- name: Enable backup timer
  ansible.builtin.systemd:
    name: cms-backup.timer
    state: started
    enabled: true
    daemon_reload: true

- name: Check for an existing backup
  ansible.builtin.find:
    paths: "{{ backup_dir }}"
    patterns: "cms-*.sql.gz"
  register: existing_backups

- name: Take the first backup now
  ansible.builtin.command: /usr/local/bin/cms-backup.sh
  become_user: postgres
  when: existing_backups.matched == 0
  changed_when: true

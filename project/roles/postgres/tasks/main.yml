---
- name: Collect package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Install PostgreSQL packages
  ansible.builtin.dnf:
    name:
      - postgresql-server
      - postgresql-contrib
      - python3-psycopg2
    state: present
    lock_timeout: 300
  when: "'postgresql-server' not in ansible_facts.packages"

- name: Check PostgreSQL data directory
  ansible.builtin.stat:
    path: "{{ postgresql_data_dir }}/PG_VERSION"
  register: pg_version

- name: Initialize PostgreSQL primary
  ansible.builtin.command: postgresql-setup --initdb
  when:
    - inventory_hostname in groups.db_primary
    - not pg_version.stat.exists

- name: Configure primary PostgreSQL
  ansible.builtin.template:
    src: postgresql-primary.conf.j2
    dest: "{{ postgresql_data_dir }}/postgresql.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  when: inventory_hostname in groups.db_primary
  notify: restart postgresql

- name: Configure primary pg_hba
  ansible.builtin.template:
    src: pg_hba-primary.conf.j2
    dest: "{{ postgresql_data_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  when: inventory_hostname in groups.db_primary
  notify: restart postgresql

- name: Start primary PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true
  when: inventory_hostname in groups.db_primary

- name: Allow PostgreSQL port
  ansible.builtin.command: firewall-cmd --permanent --add-port=5432/tcp
  register: postgres_firewall
  changed_when: "'ALREADY_ENABLED' not in postgres_firewall.stderr"

- name: Reload firewalld for PostgreSQL
  ansible.builtin.command: firewall-cmd --reload
  when: postgres_firewall.changed

- name: Create CMS database user
  become_user: postgres
  ansible.builtin.command: psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='{{ cms_db_user }}'"
  register: cms_role
  changed_when: false
  when: inventory_hostname in groups.db_primary

- name: Ensure CMS database user exists
  become_user: postgres
  ansible.builtin.command: psql -c "CREATE USER {{ cms_db_user }} WITH PASSWORD '{{ cms_db_password }}'"
  when:
    - inventory_hostname in groups.db_primary
    - cms_role.stdout | trim != '1'

- name: Ensure CMS database user password
  become_user: postgres
  ansible.builtin.command: psql -c "ALTER USER {{ cms_db_user }} WITH PASSWORD '{{ cms_db_password }}'"
  changed_when: false
  when: inventory_hostname in groups.db_primary

- name: Create replication user
  become_user: postgres
  ansible.builtin.command: psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='{{ postgres_replication_user }}'"
  register: repl_role
  changed_when: false
  when: inventory_hostname in groups.db_primary

- name: Ensure replication user exists
  become_user: postgres
  ansible.builtin.command: psql -c "CREATE USER {{ postgres_replication_user }} WITH LOGIN REPLICATION PASSWORD '{{ postgres_replication_password }}'"
  when:
    - inventory_hostname in groups.db_primary
    - repl_role.stdout | trim != '1'

- name: Ensure replication user password
  become_user: postgres
  ansible.builtin.command: psql -c "ALTER USER {{ postgres_replication_user }} WITH LOGIN REPLICATION PASSWORD '{{ postgres_replication_password }}'"
  changed_when: false
  when: inventory_hostname in groups.db_primary

- name: Create CMS database
  become_user: postgres
  ansible.builtin.command: psql -tAc "SELECT 1 FROM pg_database WHERE datname='{{ cms_db_name }}'"
  register: cms_db
  changed_when: false
  when: inventory_hostname in groups.db_primary

- name: Ensure CMS database exists
  become_user: postgres
  ansible.builtin.command: createdb -O {{ cms_db_user }} {{ cms_db_name }}
  when:
    - inventory_hostname in groups.db_primary
    - cms_db.stdout | trim != '1'

- name: Create articles table
  become_user: postgres
  ansible.builtin.command: psql -d {{ cms_db_name }}
  args:
    stdin: |
      CREATE TABLE IF NOT EXISTS articles (
        id SERIAL PRIMARY KEY,
        title TEXT NOT NULL,
        body TEXT NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
      );
      ALTER TABLE articles OWNER TO {{ cms_db_user }};
  changed_when: false
  when: inventory_hostname in groups.db_primary

- name: Check replica data directory
  ansible.builtin.stat:
    path: "{{ postgresql_data_dir }}/standby.signal"
  register: standby_signal
  when: inventory_hostname in groups.db_replica

- name: Stop empty replica service
  ansible.builtin.service:
    name: postgresql
    state: stopped
  when:
    - inventory_hostname in groups.db_replica
    - not standby_signal.stat.exists

- name: Recreate replica data directory
  ansible.builtin.file:
    path: "{{ postgresql_data_dir }}"
    state: "{{ item }}"
    owner: postgres
    group: postgres
    mode: "0700"
  loop:
    - absent
    - directory
  when:
    - inventory_hostname in groups.db_replica
    - not standby_signal.stat.exists

- name: Build replica from primary
  become_user: postgres
  ansible.builtin.command: >
    pg_basebackup -h {{ postgres_primary_ip }} -U {{ postgres_replication_user }}
    -D {{ postgresql_data_dir }} -R -X stream -P
  environment:
    PGPASSWORD: "{{ postgres_replication_password }}"
  when:
    - inventory_hostname in groups.db_replica
    - not standby_signal.stat.exists

- name: Start replica PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true
  when: inventory_hostname in groups.db_replica

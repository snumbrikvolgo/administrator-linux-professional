---
- name: Disable ufw service
  service:
    name: ufw
    state: stopped
    enabled: false
  failed_when: false

- name: Install VPN lab packages
  apt:
    name:
      - easy-rsa
      - iperf3
      - iproute2
      - net-tools
      - openvpn
      - selinux-utils
    state: present
    update_cache: true

- name: Disable SELinux if command exists
  command: setenforce 0
  changed_when: false
  failed_when: false

- name: Persist IPv4 forwarding
  copy:
    dest: /etc/sysctl.d/99-vpn-forwarding.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.ipv4.ip_forward = 1
  register: forwarding_sysctl

- name: Apply IPv4 forwarding
  command: sysctl --system
  changed_when: forwarding_sysctl.changed

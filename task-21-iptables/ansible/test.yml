---
- name: Test port knocking and web DNAT
  hosts: centralRouter
  become: true
  gather_facts: false
  tasks:
    - name: Check that SSH to inetRouter is closed before knock
      shell: "timeout 3 bash -c '</dev/tcp/192.168.255.1/22'"
      register: ssh_before
      failed_when: ssh_before.rc == 0
      changed_when: false

    - name: Send knock sequence
      command: /usr/local/bin/knock-inetRouter
      changed_when: false

    - name: Check real SSH to inetRouter after knock
      command: ssh-inetRouter hostname
      register: ssh_after
      changed_when: false
      failed_when: ssh_after.stdout.strip() != "inetRouter"

- name: Test HTTP DNAT from host side to centralServer
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  tasks:
    - name: Check centralServer nginx through inetRouter2 DNAT port
      uri:
        url: http://192.168.56.10:8080/
        return_content: true
      register: web_check
      failed_when: "'task-21 iptables' not in web_check.content"
